[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchguard"
version = "0.1.0"
description = "Strict, offline regression checks for AI benchmark results"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
benchguard = "benchguard.cli:main"
benchguard-lmeval = "benchguard.lm_eval_adapter:main"

[tool.setuptools.packages.find]
where = ["src"]
