[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "benchguard"
version = "0.1.0"
description = "Strict, offline regression checks for AI benchmark results"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
benchguard = "benchguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
