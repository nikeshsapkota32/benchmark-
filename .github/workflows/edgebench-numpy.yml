name: EdgeBench optional NumPy example
on: [push, pull_request]
permissions:
  contents: read
jobs:
  numpy-example:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.10'
            numpy: '2.2.6'
          - python: '3.12'
            numpy: '2.3.5'
          - python: '3.13'
            numpy: '2.3.5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . 'numpy==${{ matrix.numpy }}' 'threadpoolctl==3.6.0'
        working-directory: projects/edgebench
      - run: python -I -m unittest discover -s tests_optional -v
        working-directory: projects/edgebench
